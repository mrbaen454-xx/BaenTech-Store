spring.application.name=shiping-serive

server.port=${PORT:${SHIPPING_SERVICE_PORT:8087}}

# Load .env file
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${SHIPPING_DB_URL}
spring.datasource.username=${SHIPPING_DB_USERNAME}
spring.datasource.password=${SHIPPING_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:*}
