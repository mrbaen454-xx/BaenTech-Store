spring.application.name=notification-service

server.port=${PORT:${NOTIFICATION_SERVICE_PORT:8088}}

# Load .env file
spring.config.import=optional:file:.env[.properties]

# ===============================
# EUREKA CLIENT
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}

eureka.instance.prefer-ip-address=true

# ===============================
# MAIL CONFIG - GMAIL SMTP
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:DEBUG}
