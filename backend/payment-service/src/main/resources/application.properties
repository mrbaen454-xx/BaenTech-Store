spring.application.name=payment-service

server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/baentech_payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*

# XENDIT
# Isi lewat environment variable lokal. Jangan commit API key asli ke GitHub.
# XENDIT_SECRET_KEY harus SECRET KEY, bukan PUBLIC KEY.
xendit.secret-key=${XENDIT_SECRET_KEY:}
xendit.callback-token=${XENDIT_CALLBACK_TOKEN:}
xendit.invoice-url=https://api.xendit.co/v2/invoices

# FRONTEND
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# INTERNAL SERVICE TOKEN
internal.api-key=${INTERNAL_API_KEY:baentech-internal-secret-2026}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8085}
